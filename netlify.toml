# Netlify build config — Next.js 15 via the @netlify/plugin-nextjs OpenNext adapter.
# The plugin is pinned as a devDependency and listed below so the adapter
# reliably provisions the SSR/API functions (auto-detection alone did not).
#
# Secrets (TURSO_AUTH_TOKEN, ADMIN_PASSWORD, …) must be set in the Netlify UI,
# NOT here — netlify.toml env vars are build-time only and end up in git.

[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"
  [plugins.inputs]
    # default: no extra config needed

# --- Security headers (site-wide) ---
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.turso.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Cross-Origin-Opener-Policy = "same-origin"
